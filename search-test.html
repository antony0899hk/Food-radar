<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEGO Food Search Lab</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f4ee;margin:0;color:#171717}.wrap{max-width:850px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e8e2d9;border-radius:18px;padding:16px;margin:12px 0}input,select,button{padding:12px;border:1px solid #ddd;border-radius:12px;font-size:16px}input{width:100%;box-sizing:border-box}button{background:#171717;color:#fff;font-weight:800}.row{display:flex;gap:8px;flex-wrap:wrap}.item{padding:12px 0;border-top:1px dashed #ddd}.muted{color:#777;font-size:13px}</style></head><body><div class="wrap"><h1>Food Radar Search Lab</h1><div class="card"><div id="meta" class="muted">初始化資料庫…</div><input id="q" placeholder="試：咖啡、魚蛋、油尖旺、快食"><div class="row" style="margin-top:10px"><select id="kind"><option value="">全部類型</option><option>茶餐廳</option><option>小食</option><option>咖啡</option><option>麵包</option><option>熟食中心</option></select><button id="go">搜尋</button><button id="reload">重建資料庫</button></div></div><div class="card"><b id="count">0 個結果</b><div id="results"></div></div></div><script src="src/data-store.js"></script><script src="src/search-engine.js"></script><script>let items=[];async function source(){try{const r=await fetch('data/food-index.json',{cache:'no-store'});if(r.ok)return {items:await r.json(),name:'data/food-index.json'};}catch{}return {items:await fetch('data/food-search-seed.json').then(r=>r.json()),name:'seed (waiting FEHD normalized index)'};}async function importData(){const s=await source();items=s.items;await CEGOStore.replaceAll(items,{source:s.name});await refresh();}async function refresh(){items=await CEGOStore.all();const m=await CEGOStore.meta();meta.textContent=`IndexedDB：${m?.count||0} 筆｜來源 ${m?.source||'—'}｜更新 ${m?.updatedAt?new Date(m.updatedAt).toLocaleString():'—'}`;run()}function run(){const list=CEGOSearch.search(items,q.value,{kind:kind.value||undefined});count.textContent=list.length+' 個結果';results.innerHTML=list.slice(0,50).map(x=>`<div class="item"><b>${x.name||x.shopSign}</b><div class="muted">${x.kind||''}｜${x.district||''}｜${x.address||''}｜score ${x._score}</div></div>`).join('')||'<div class="muted">冇結果</div>'}go.onclick=run;q.oninput=run;kind.onchange=run;reload.onclick=importData;(async()=>{items=await CEGOStore.all();if(!items.length)await importData();else await refresh()})();</script></body></html>
