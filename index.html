<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>C•E•GO Food Radar V2</title><link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet"/><style>:root{--bg:#f7f4ee;--card:#fff;--ink:#171717;--muted:#6f6f6f;--brand:#e65a2f;--line:#e9e4dc}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}.app{max-width:1100px;margin:auto}.panel{margin:10px 14px;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.05)}header{padding:18px 18px 8px}.brand{font-weight:900;font-size:24px}.sub,.status,.source{color:var(--muted);font-size:13px}#map{height:340px}.controls{padding:14px;display:grid;gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap}button,.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-size:14px}button.primary{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:800}.chip.active{background:#171717;color:#fff}.data-status{padding:12px 14px;background:#fff8eb;border-top:1px solid var(--line);font-size:12px}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:10px 14px 20px}.section-title{display:flex;justify-content:space-between;align-items:end;padding:16px 16px 6px}.section-title h2{margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;position:relative}.rank{position:absolute;right:12px;top:12px;background:#171717;color:#fff;border-radius:999px;padding:4px 8px;font-size:12px}.name{font-size:18px;font-weight:900}.type{color:var(--muted);font-size:13px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.pill{font-size:12px;background:#f4f2ed;padding:6px 8px;border-radius:999px}.footer-note{padding:8px 18px 24px;font-size:12px;color:var(--muted)}@media(max-width:760px){#map{height:290px}.results{grid-template-columns:1fr}.panel{margin:8px}}</style></head>
<body><div class="app"><header><div class="brand">C•E•GO Food Radar</div><div class="sub">V2｜附近食乜？核心引擎＋官方 FEHD 資料管</div></header><div class="panel"><div id="map"></div><div class="controls"><div class="row"><button id="locateBtn" class="primary">📍 用我位置</button><button id="demoBtn">香港示範位置</button><span class="status" id="status">未定位</span></div><div><div class="status">步行範圍</div><div class="row" id="radiusGroup"><button class="chip" data-min="5">5 分鐘</button><button class="chip active" data-min="10">10 分鐘</button><button class="chip" data-min="15">15 分鐘</button></div></div><div><div class="status">預算</div><div class="row" id="budgetGroup"><button class="chip" data-budget="50">&lt;$50</button><button class="chip active" data-budget="100">$100 以下</button><button class="chip" data-budget="200">$200 以下</button><button class="chip" data-budget="9999">不限</button></div></div><div class="row"><label class="chip"><input id="openNow" type="checkbox" checked/> 而家營業</label><label class="chip"><input id="solo" type="checkbox" checked/> 一個人食</label><label class="chip"><input id="quick" type="checkbox"/> 想快食</label></div></div><div class="data-status" id="dataStatus">FEHD：等待第一次自動更新；Nearby 結果暫以示範座標驗證核心。</div></div><div class="section-title"><h2>CEGO 幫你揀</h2><span class="status" id="countLabel">0 個結果</span></div><div id="results" class="results"></div><div class="footer-note">官方牌照資料已由 GitHub Action 每日抓取。下一步：CSDI 座標配對 → 真正 nearby results → 新持牌食肆 diff。</div></div>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script><script>
const state={user:{lat:22.3193,lng:114.1694},mins:10,budget:100,openNow:true,solo:true,quick:false,markers:[]};const DEMO=[{name:'金記冰室',type:'茶餐廳',lat:22.3197,lng:114.1708,price:68,open:true,solo:true,quick:true},{name:'街角魚蛋',type:'小食',lat:22.3179,lng:114.1686,price:38,open:true,solo:true,quick:true},{name:'城中咖啡',type:'咖啡',lat:22.3209,lng:114.1679,price:82,open:true,solo:true,quick:false},{name:'老字號麵包店',type:'麵包',lat:22.3218,lng:114.1721,price:42,open:true,solo:true,quick:true},{name:'熟食市場檔 A',type:'熟食中心',lat:22.3166,lng:114.1718,price:74,open:true,solo:true,quick:false}];
function dist(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180,p1=t(a),p2=t(c),dp=t(c-a),dl=t(d-b),h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}const radius=m=>m*75;
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[state.user.lng,state.user.lat],zoom:15});let userMarker=new maplibregl.Marker({color:'#e65a2f'}).setLngLat([state.user.lng,state.user.lat]).addTo(map);
function results(){return DEMO.map(p=>({...p,d:dist(state.user.lat,state.user.lng,p.lat,p.lng)})).filter(p=>p.d<=radius(state.mins)&&p.price<=state.budget&&(!state.openNow||p.open)&&(!state.solo||p.solo)&&(!state.quick||p.quick)).sort((a,b)=>a.d-b.d).slice(0,5)}
function render(){state.openNow=openNow.checked;state.solo=solo.checked;state.quick=quick.checked;const list=results();countLabel.textContent=list.length+' 個結果';resultsEl.innerHTML=list.map((p,i)=>`<div class="card"><div class="rank">#${i+1}</div><div class="name">${p.name}</div><div class="type">${p.type}</div><div class="meta"><span class="pill">🚶 約 ${Math.max(1,Math.round(p.d/75))} 分鐘</span><span class="pill">💰 約 $${p.price}</span><span class="pill">${p.open?'🟢 營業中':'🔴 已關門'}</span></div><div class="source">Nearby Core demo｜${Math.round(p.d)}m</div></div>`).join('');state.markers.forEach(m=>m.remove());state.markers=[];list.forEach((p,i)=>{const e=document.createElement('div');e.style.cssText='width:30px;height:30px;border-radius:50%;background:#171717;color:#fff;display:grid;place-items:center;font-weight:800;border:2px solid white';e.textContent=i+1;state.markers.push(new maplibregl.Marker({element:e}).setLngLat([p.lng,p.lat]).addTo(map))})}
const resultsEl=document.querySelector('#results'),countLabel=document.querySelector('#countLabel'),openNow=document.querySelector('#openNow'),solo=document.querySelector('#solo'),quick=document.querySelector('#quick');
fetch('data/fehd-meta.json').then(r=>r.json()).then(m=>{document.querySelector('#dataStatus').textContent=`FEHD 已同步｜${new Date(m.fetchedAt).toLocaleString()}｜食肆 ${Math.round((m.sources.restaurants?.bytes||0)/1024)}KB｜其他食物牌照 ${Math.round((m.sources.otherFood?.bytes||0)/1024)}KB`}).catch(()=>{});
function setLocation(lat,lng,label){state.user={lat,lng};userMarker.setLngLat([lng,lat]);map.flyTo({center:[lng,lat],zoom:15});document.querySelector('#status').textContent=label;render()}
document.querySelector('#locateBtn').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>setLocation(p.coords.latitude,p.coords.longitude,'已用目前位置'),()=>status.textContent='未能定位',{enableHighAccuracy:true,timeout:12000,maximumAge:30000}):null;document.querySelector('#demoBtn').onclick=()=>setLocation(22.3193,114.1694,'香港示範位置');document.querySelectorAll('#radiusGroup .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#radiusGroup .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.mins=+b.dataset.min;render()});document.querySelectorAll('#budgetGroup .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#budgetGroup .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.budget=+b.dataset.budget;render()});[openNow,solo,quick].forEach(x=>x.onchange=render);render();
</script></body></html>
