<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>C•E•GO Food Radar V3</title><link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet"><style>:root{--bg:#f7f4ee;--card:#fff;--ink:#171717;--muted:#6f6f6f;--brand:#e65a2f;--line:#e9e4dc;--ok:#16845b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}.app{max-width:1100px;margin:auto}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:20px}.panel{margin:10px 14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.05)}header{padding:18px 18px 8px}.brand{font-weight:900;font-size:24px}.sub,.status,.source{color:var(--muted);font-size:13px}#map{height:340px}.controls{padding:14px;display:grid;gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap}button,.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-size:14px;cursor:pointer}button.primary{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:800}.chip.active{background:#171717;color:#fff}.data-status{padding:12px 14px;background:#fff8eb;border-top:1px solid var(--line);font-size:12px;line-height:1.5}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:10px 14px 20px}.section-title{display:flex;justify-content:space-between;align-items:end;padding:16px 16px 6px}.section-title h2{margin:0}.card{padding:14px;position:relative}.rank{position:absolute;right:12px;top:12px;background:#171717;color:#fff;border-radius:999px;padding:4px 8px;font-size:12px}.name{font-size:18px;font-weight:900;padding-right:42px}.type{color:var(--muted);font-size:13px;margin-top:3px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.pill{font-size:12px;background:#f4f2ed;padding:6px 8px;border-radius:999px}.source{line-height:1.4}.source.live{color:var(--ok);font-weight:700}.footer-note{padding:8px 18px 24px;font-size:12px;color:var(--muted);line-height:1.5}a{color:var(--brand);text-decoration:none;font-weight:700}@media(max-width:760px){#map{height:290px}.results{grid-template-columns:1fr}.panel{margin:8px}}</style></head>
<body><div class="app"><header><div class="brand">C•E•GO Food Radar</div><div class="sub">V3｜GPS → CSDI bbox → 真持牌食肆 nearby</div></header><div class="panel"><div id="map"></div><div class="controls"><div class="row"><button id="locateBtn" class="primary">📍 用我位置</button><button id="demoBtn">大埔示範</button><span class="status" id="status">未定位</span></div><div><div class="status">步行範圍</div><div class="row" id="radiusGroup"><button class="chip" data-min="5">5 分鐘</button><button class="chip active" data-min="10">10 分鐘</button><button class="chip" data-min="15">15 分鐘</button></div></div></div><div class="data-status" id="dataStatus">等待定位後查詢官方 CSDI 食肆牌照…</div></div><div class="section-title"><h2>附近持牌食肆</h2><span class="status" id="countLabel">0 個結果</span></div><div id="results" class="results"></div><div class="footer-note">資料來源：食物環境衞生署 Restaurant licences／CSDI。現階段只代表「持牌食肆＋官方座標」，未代表即時營業狀態、價錢或排隊情況；之後再疊加 CEGO tags 與 live enrichment。</div></div>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script><script>
const WFS='https://portal.csdi.gov.hk/server/services/common/fehd_rcd_1630036390312_58893/MapServer/WFSServer';
const TYPE='fehd_rl';
const state={user:{lat:22.4502,lng:114.1685},mins:10,items:[],markers:[],source:'none'};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[state.user.lng,state.user.lat],zoom:15});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
const userMarker=new maplibregl.Marker({color:'#e65a2f'}).setLngLat([state.user.lng,state.user.lat]).addTo(map);
function dist(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180,p1=t(a),p2=t(c),dp=t(c-a),dl=t(d-b),h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const radius=m=>m*75;
function bbox(lat,lng,m){const r=m+250,dLat=r/111320,dLng=r/(111320*Math.cos(lat*Math.PI/180));return [lat-dLat,lng-dLng,lat+dLat,lng+dLng]}
function first(p,keys){for(const k of keys){if(p[k]!==undefined&&p[k]!==null&&String(p[k]).trim())return String(p[k]).trim()}return ''}
function normalizeFeature(f,i){const p=f.properties||{},g=f.geometry||{};let lng,lat;if(g.type==='Point'&&Array.isArray(g.coordinates)){[lng,lat]=g.coordinates}else if(g.type==='MultiPoint'&&g.coordinates?.[0]){[lng,lat]=g.coordinates[0]}if(!Number.isFinite(lat)||!Number.isFinite(lng))return null;const name=first(p,['SHOP_SIGN_TC','SHOP_SIGN','SHOP_SIGN_EN','shop_sign_tc','shop_sign','NAME_TC','NAME','name','TRADENAME_TC','TRADENAME'])||'未提供店名';const type=first(p,['LICENCE_TYPE_TC','LICENCE_TYPE','licence_type_tc','LIC_TYPE_TC','LIC_TYPE','TYPE_TC','TYPE'])||'持牌食肆';const address=first(p,['ADDRESS_TC','ADDRESS','address_tc','address','PREMISES_ADDRESS_TC','PREMISES_ADDRESS']);const licence=first(p,['LICENCE_NO','LICENCE_NUMBER','licence_no','LIC_NO']);return {id:f.id||licence||i,name,type,address,licence,lat,lng,d:dist(state.user.lat,state.user.lng,lat,lng),source:'FEHD / CSDI'}}
async function queryNearby(){const r=radius(state.mins),b=bbox(state.user.lat,state.user.lng,r);const qs=new URLSearchParams({service:'WFS',version:'2.0.0',request:'GetFeature',typeNames:TYPE,outputFormat:'GeoJSON',srsName:'EPSG:4326',bbox:b.join(','),count:'300',resultType:'results',startIndex:'0'});const url=WFS+'?'+qs.toString();$('#dataStatus').textContent='CSDI：正在查詢你附近持牌食肆…';try{const res=await fetch(url,{headers:{Accept:'application/json'}});if(!res.ok)throw new Error('HTTP '+res.status);const gj=await res.json();const arr=(gj.features||[]).map(normalizeFeature).filter(Boolean).filter(x=>x.d<=r).sort((a,b)=>a.d-b.d);state.items=arr;state.source='csdi';$('#dataStatus').textContent=`✅ CSDI 即時結果：bbox 命中 ${(gj.features||[]).length} 筆，${state.mins} 分鐘範圍內 ${arr.length} 間持牌食肆。`;render();}catch(e){state.items=[];state.source='error';$('#dataStatus').textContent='⚠️ 官方 CSDI 查詢暫時失敗：'+e.message+'。GPS 已正常，請稍後再試。';render()}}
function render(){const list=state.items.slice(0,20);$('#countLabel').textContent=(state.source==='csdi'?state.items.length:0)+' 個結果';$('#results').innerHTML=list.length?list.map((p,i)=>`<article class="card"><div class="rank">#${i+1}</div><div class="name">${escapeHtml(p.name)}</div><div class="type">${escapeHtml(p.type)}</div><div class="meta"><span class="pill">📍 ${Math.round(p.d)}m</span><span class="pill">🚶 約 ${Math.max(1,Math.round(p.d/75))} 分鐘</span></div>${p.address?`<div class="source">${escapeHtml(p.address)}</div>`:''}<div class="source live">官方持牌資料 · CSDI</div><p><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.lat+','+p.lng)}">Google Maps ↗</a></p></article>`).join(''):`<div class="card"><div class="status">${state.source==='error'?'暫時未能取得官方 nearby 資料。':'請先按「用我位置」。'}</div></div>`;state.markers.forEach(m=>m.remove());state.markers=[];list.forEach((p,i)=>{const e=document.createElement('div');e.style.cssText='width:30px;height:30px;border-radius:50%;background:#171717;color:#fff;display:grid;place-items:center;font-weight:800;border:2px solid #fff;box-shadow:0 2px 8px #0003';e.textContent=i+1;state.markers.push(new maplibregl.Marker({element:e}).setLngLat([p.lng,p.lat]).setPopup(new maplibregl.Popup({offset:20}).setHTML(`<b>${escapeHtml(p.name)}</b><br>${Math.round(p.d)}m`)).addTo(map))})}
function escapeHtml(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function setLocation(lat,lng,label){state.user={lat,lng};userMarker.setLngLat([lng,lat]);map.flyTo({center:[lng,lat],zoom:15});$('#status').textContent=label;await queryNearby()}
$('#locateBtn').addEventListener('click',()=>{if(!navigator.geolocation){$('#status').textContent='此瀏覽器不支援定位';return}$('#status').textContent='正在取得位置…';navigator.geolocation.getCurrentPosition(p=>setLocation(p.coords.latitude,p.coords.longitude,`已定位 · 精確度約 ${Math.round(p.coords.accuracy)}m`),e=>{$('#status').textContent=e.code===1?'定位權限被拒絕':e.code===3?'定位逾時':'未能取得位置'},{enableHighAccuracy:true,timeout:15000,maximumAge:0})});
$('#demoBtn').addEventListener('click',()=>setLocation(22.4502,114.1685,'大埔示範位置'));
$$('#radiusGroup .chip').forEach(b=>b.addEventListener('click',()=>{$$('#radiusGroup .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.mins=+b.dataset.min;if(state.source!=='none')queryNearby()}));
render();
</script></body></html>
