name: Update FEHD data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
  push:
    paths:
      - 'scripts/update-fehd.mjs'
      - '.github/workflows/update-fehd.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-fehd.mjs
      - name: Commit updated FEHD snapshot
        run: |
          git config user.name "cego-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw data/fehd-meta.json data/fehd-restaurants.json data/fehd-other-food.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh FEHD data"
          git push
